appId: com.edtpui.essayharness
productName: EssayHarness
copyright: Copyright © 2026 Ethan Pui

directories:
  # dist-app/ is produced by scripts/stage-standalone.mjs; dist/ is the
  # electron-builder output (already gitignored).
  app: dist-app
  output: dist

# The packaged app itself is just the Electron shell. The Next.js standalone
# server ships as a resource instead, so server.js keeps .next/static and
# public/ beside it, exactly the layout the standalone server expects.
files:
  - electron/**
  - package.json

extraResources:
  - from: dist-app/server
    to: server
  # The server's dependencies. They cannot live at server/node_modules:
  # electron-builder strips a top-level "node_modules" folder out of a
  # resource copy. One level up, at resources/node_modules, Node finds
  # them anyway by walking up from server.js.
  - from: dist-app/deps
    to: node_modules

win:
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch:
        - x64
        - arm64
