services:
  essayharness:
    build: .
    container_name: essayharness
    restart: unless-stopped
    init: true
    environment:
      # Host names you open the app under (e.g. your Tailscale name), from .env next to this file.
      SE_ALLOWED_HOSTS: ${SE_ALLOWED_HOSTS:-}
    ports:
      # Loopback only; publish it to other devices with `tailscale serve`, not by binding 0.0.0.0.
      - "127.0.0.1:3400:3000"
    extra_hosts:
      # Lets the app reach Ollama on the host: base URL http://host.docker.internal:11434/v1
      - "host.docker.internal:host-gateway"
    volumes:
      - essayharness_data:/var/lib/essayharness

volumes:
  essayharness_data:
